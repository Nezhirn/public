services:
  redis:
    image: redis:latest
    container_name: redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    #command: ["redis-server", "--save", "", "--appendonly", "no"]
    volumes:
      - /home/andrew/dbase/redis/data:/data  # <-- папка на хосте для хранения данных Redis
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "156483"]
